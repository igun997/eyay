[package]
name = "eyeai-engine"
version = "0.1.0"
edition = "2024"
description = "EyeAI worker: decode, YOLOX detect, track, write events to Postgres, classify, serve live MJPEG"

[dependencies]
# Pins follow the proof of concept this engine grew from (jenggo/poc-yolo-coco): ffmpeg 9.x dev libs, ONNX Runtime 1.31.
ffmpeg-next = "=9.0.0"
ort = { version = "=2.0.0-rc.15", features = ["ndarray"] }
ndarray = "=0.17.2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tiny_http = "0.12"
ctrlc = { version = "3", features = ["termination"] }

[features]
cuda = ["ort/cuda"]

[profile.release]
debug = false
