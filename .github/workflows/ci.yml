name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, test, build, migrate)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: eyeai, POSTGRES_PASSWORD: eyeai, POSTGRES_DB: eyeai }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eyeai" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version from web/package.json "packageManager"
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
        env: { DATABASE_URL: "postgres://eyeai:eyeai@localhost:5432/eyeai" }
      - name: "Migration runner against a real database (run twice, second run must be a no-op)"
        run: pnpm migrate && pnpm migrate
        env: { DATABASE_URL: "postgres://eyeai:eyeai@localhost:5432/eyeai", ADMIN_EMAIL: ci@example.com, ADMIN_PASSWORD: ci-password-123 }

  python:
    name: Engine + worker tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: eyeai, POSTGRES_PASSWORD: eyeai, POSTGRES_DB: eyeai }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eyeai" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "pyproject.toml\nworker/requirements.txt" }
      - run: pip install -e '.[dev]' -r worker/requirements.txt
      - name: Models and sample videos (sha256-checked)
        run: scripts/fetch_assets.sh
      - name: "Apply DB schema twice (migrations must be idempotent) for the worker integration test"
        run: |
          for pass in 1 2; do for f in db/migrations/*.sql; do
            PGPASSWORD=eyeai psql -h localhost -U eyeai -d eyeai -v ON_ERROR_STOP=1 -q -f "$f"
          done; done
      - run: pytest -q tests worker/tests
        env:
          PYTHONPATH: src:worker
          DATABASE_URL: postgresql://eyeai:eyeai@localhost:5432/eyeai

  images:
    name: Build images (app, worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: docker/web.Dockerfile, tags: "eyeai-app:ci", load: true, cache-from: "type=gha,scope=app", cache-to: "type=gha,scope=app,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: docker/worker.Dockerfile, tags: "eyeai-worker:ci", load: true, cache-from: "type=gha,scope=worker", cache-to: "type=gha,scope=worker,mode=max" }

  e2e:
    name: E2E (1 live RTSP stream + d1 classifier)
    runs-on: ubuntu-latest
    needs: [web, python]
    timeout-minutes: 45   # first run downloads the 3.7 GB d1 model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Build stack, run e2e
        run: e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-output, path: e2e/out, if-no-files-found: ignore }

  publish:
    name: Publish images (ghcr.io)
    # only after a merge to main, and only when every check including the e2e passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, python, images, e2e]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Image names (ghcr requires lowercase)
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}-app:latest
            ghcr.io/${{ env.REPO }}-app:${{ github.sha }}
          cache-from: type=gha,scope=app
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/worker.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}-worker:latest
            ghcr.io/${{ env.REPO }}-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
