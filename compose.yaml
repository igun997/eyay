# Local stack:    docker compose up --build                  (app + worker + db)
# With demo feed: docker compose --profile dev up --build    (adds mediamtx + sample-video feeder)
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: eyeai, POSTGRES_PASSWORD: eyeai, POSTGRES_DB: eyeai }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["${DB_PORT:-5432}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U eyeai"], interval: 3s, timeout: 3s, retries: 20 }

  app:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    image: eyeai-app:latest
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://eyeai:eyeai@db:5432/eyeai
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-please-32b}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@eyeai.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
      WORKER_URL: http://worker:8090
    ports: ["${APP_PORT:-3000}:3000"]

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    image: eyeai-worker:latest
    depends_on: { db: { condition: service_healthy }, app: { condition: service_healthy } }  # app applies migrations
    environment:
      DATABASE_URL: postgres://eyeai:eyeai@db:5432/eyeai
      WORKER_ID: worker-1
    expose: ["8090"]

  mediamtx:
    profiles: [dev]
    image: bluenviron/mediamtx:latest
    ports: ["8554:8554"]

  feeder:
    profiles: [dev]
    build: { context: ., dockerfile: docker/feeder.Dockerfile }
    image: eyeai-feeder:latest
    depends_on: [mediamtx]
    volumes: ["./data/samples:/samples:ro"]
    # register in the UI: rtsp://mediamtx:8554/dock2 | /gate | /aisle   and   http://feeder:8099/yard/live.m3u8

volumes:
  pgdata:
